name: Build ZMK firmware

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 tests/check_mapping.py
  build:
    needs: validate
    uses: ./.github/workflows/build-firmware.yml
