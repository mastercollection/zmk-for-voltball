CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_BT_MAX_CONN=3
CONFIG_BT_MAX_PAIRED=3
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_USB=y
CONFIG_ZMK_SLEEP=n
# No deep sleep: the halves need the central awake. After a minute without key or
# trackball input, blank the panel and turn its backlight off; any input restores it.
CONFIG_ZMK_IDLE_TIMEOUT=60000
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_APDS9960=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=50
CONFIG_LV_Z_VDB_SIZE=25
CONFIG_ZMK_HID_INDICATORS=y
CONFIG_ZMK_WPM=y
CONFIG_LV_USE_IMAGE=y
# Mascot frames are I8 C arrays decoded one line at a time; never expand them in RAM.
CONFIG_LV_BIN_DECODER_RAM_LOAD=n
CONFIG_LV_USE_LINE=y
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_28=y
