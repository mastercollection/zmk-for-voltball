# Deep sleep after 2 hours without key or trackball input (ZMK default 15 min).
# This cannot live in Kconfig.defconfig: ZMK's own default is parsed first and
# wins, so it has to be a .conf assignment. Not in config/voltball.conf either,
# because ZMK merges that into the dongle too, where ZMK_SLEEP is off.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000
