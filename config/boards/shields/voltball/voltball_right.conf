CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_NON_LIPO_BATTERY_MANAGEMENT=y

# P0.31/AIN7 is connected to the midpoint of a fixed 1M/1M divider, so the
# driver reads half of the actual AA voltage. This module compares the raw ADC
# millivolts directly and does not compensate for the divider.
#
# Active profile: Toshiba IMPULSE AA 2550 mAh, nominal 1.2 V NiMH.
# ADC thresholds assume the existing 1:1 voltage divider.
# These are initial voltage-based estimates, not calibrated state of charge.
#   650 mV at ADC = 1.30 V at cell = 100% indication
#   550 mV at ADC = 1.10 V at cell = 0% indication
#   500 mV at ADC = 1.00 V at cell = low-voltage shutdown
# Capacity in mAh is not used by this voltage-based battery module.
CONFIG_ZMK_NON_LIPO_MAX_MV=650
CONFIG_ZMK_NON_LIPO_MIN_MV=550
CONFIG_ZMK_NON_LIPO_LOW_MV=500

# Non-rechargeable 1.5 V alkaline-only profile:
#   750 mV at ADC = 1.50 V at cell = 100%
#   500 mV at ADC = 1.00 V at cell = 0%
#   425 mV at ADC = 0.85 V at cell = low-voltage shutdown
# CONFIG_ZMK_NON_LIPO_MAX_MV=750
# CONFIG_ZMK_NON_LIPO_MIN_MV=500
# CONFIG_ZMK_NON_LIPO_LOW_MV=425

# Enter deep sleep after advertising without a connection for 5 minutes.
CONFIG_ZMK_NON_LIPO_ADV_SLEEP_TIMEOUT=300000

CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
CONFIG_ZMK_STUDIO=n
