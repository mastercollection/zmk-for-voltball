description: |
  Latched auto-mouse layer activated by accumulated pointer movement.
  Cells are layer index and timeout (must be zero). Resolved non-modifier
  actions at typing-positions cancel the layer without emitting press or release.
  Requires the pinned ZMK behavior-dispatch hook.

compatible: "zmk,input-processor-threshold-temp-layer"

include: ip_two_param.yaml

properties:
  activation-threshold:
    type: int
    default: 0
    description: |
      Minimum accumulated absolute X/Y sensor counts required to activate the layer.
      Zero activates on the first nonzero motion report.

  require-prior-idle-ms:
    type: int
    default: 0
    description: |
      Suppress activation after a non-modifier action at typing-positions.
      A swallowed action also blocks activation until release, then restarts
      this delay. Suppressed movement is discarded, not accumulated.

  typing-positions:
    type: array
    required: true
    description: |
      Physical positions whose first non-modifier action is swallowed to exit
      auto mouse, including mouse, scroll, layer and no-op bindings. Only key
      press/sticky modifier actions are exempt; hold-taps resolve before filtering.
      Combos containing any of these positions follow the same rule.
