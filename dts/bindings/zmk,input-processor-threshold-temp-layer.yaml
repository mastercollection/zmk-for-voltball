description: |
  Latched auto-mouse layer activated by accumulated pointer movement.
  Cells are layer index and timeout (must be zero). A non-modifier press on a key
  that is &trans on that layer cancels it and is delivered normally (QMK style).
  Requires the pinned ZMK behavior-dispatch hook.

compatible: "zmk,input-processor-threshold-temp-layer"

include: ip_two_param.yaml

properties:
  activation-threshold:
    type: int
    default: 0
    description: |
      Minimum accumulated absolute X/Y sensor counts required to activate the layer.
      Zero activates on the first nonzero motion report.

  require-prior-idle-ms:
    type: int
    default: 0
    description: |
      Suppress activation after a non-modifier press on an exit (&trans) key.
      Suppressed movement is discarded, not accumulated.

  mouse-layer:
    type: int
    required: true
    description: |
      Index of the latched layer; must equal the listener cell. Exit keys are
      read from its bindings, so it must be known before any motion.
